<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Voxclunibus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Mulish:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      flex-direction: column;
      background: var(--black);
      color: var(--white);
    }
    .error-page .code {
      font-family: var(--font-display);
      font-size: clamp(80px, 20vw, 160px);
      font-weight: 700;
      letter-spacing: -4px;
      line-height: 1;
      color: rgba(255,255,255,0.08);
      margin-bottom: 0;
    }
    .error-page h1 {
      font-family: var(--font-display);
      font-size: clamp(22px, 4vw, 36px);
      font-weight: 700;
      margin-bottom: 12px;
      margin-top: -20px;
    }
    .error-page p {
      font-size: 15px;
      color: rgba(255,255,255,0.45);
      max-width: 380px;
      line-height: 1.7;
      margin-bottom: 32px;
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="code">404</div>
    <h1>This page doesn't exist.</h1>
    <p>Maybe it was never here. Maybe it left without saying goodbye. Either way — the shirts are still available.</p>
    <a href="/" class="btn">Back to shop</a>
  </div>
</body>
</html>
