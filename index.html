<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxclunibus — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Mulish:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      color: #fff;
      font-family: 'Mulish', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }
    .container { max-width: 520px; }
    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #fff;
      margin-bottom: 60px;
      display: block;
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(36px, 8vw, 72px);
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 24px;
    }
    p {
      font-size: 16px;
      color: rgba(255,255,255,0.5);
      line-height: 1.7;
      margin-bottom: 48px;
    }
    .notify-form {
      display: flex;
      max-width: 380px;
      margin: 0 auto 32px;
    }
    .notify-form input {
      flex: 1;
      padding: 14px 16px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-right: none;
      color: #fff;
      font-family: 'Mulish', sans-serif;
      font-size: 14px;
      outline: none;
    }
    .notify-form input::placeholder { color: rgba(255,255,255,0.3); }
    .notify-form input:focus { border-color: rgba(255,255,255,0.4); }
    .notify-form button {
      padding: 14px 24px;
      background: #fff;
      color: #111;
      border: none;
      font-family: 'Mulish', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s;
    }
    .notify-form button:hover { opacity: 0.85; }
    .social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    .social a {
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      transition: color 0.2s;
    }
    .social a:hover { color: #fff; }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: #fff;
      color: #111;
      padding: 11px 24px;
      font-size: 13px;
      opacity: 0;
      transition: all 0.25s;
      pointer-events: none;
      font-family: 'Mulish', sans-serif;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="container">
    <span class="logo">VOXCLUNIBUS</span>
    <h1>Something<br>good is<br>coming.</h1>
    <p>Bold, funny, a little too real. T-shirts for people who shouldn't be trusted in formal settings. Launching very soon.</p>

    <div class="notify-form">
      <input type="email" id="notifyEmail" placeholder="your@email.com" />
      <button onclick="handleNotify()">Notify me</button>
    </div>

    <div class="social">
      <a href="https://www.instagram.com/voxclunibus" target="_blank">Instagram</a>
      <span style="color:rgba(255,255,255,0.2)">·</span>
      <a href="https://www.tiktok.com/@voxclunibus" target="_blank">TikTok</a>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    function handleNotify() {
      const email = document.getElementById('notifyEmail').value;
      if (!email || !email.includes('@')) {
        showToast('Please enter a valid email.');
        return;
      }
      showToast("You're on the list!");
      document.getElementById('notifyEmail').value = '';
    }
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }
  </script>
</body>
</html>
