<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed — Voxclunibus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Mulish:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .success-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px 24px; flex-direction: column; background: var(--black); color: var(--white); }
    .success-icon { font-size: 64px; margin-bottom: 24px; }
    .success-page h1 { font-family: var(--font-display); font-size: clamp(36px, 8vw, 72px); font-weight: 700; letter-spacing: -1px; color: var(--white); margin-bottom: 16px; }
    .success-page p { font-size: 16px; color: rgba(255,255,255,0.55); max-width: 420px; line-height: 1.7; margin-bottom: 10px; }
    .back-btn { margin-top: 36px; display: inline-block; padding: 14px 36px; background: var(--white); color: var(--black); font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; transition: opacity 0.2s; }
    .back-btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="success-page">
    <div class="success-icon">🎉</div>
    <h1>Order confirmed!</h1>
    <p>Your shirt is heading to the printer. You'll get a tracking email once it ships — usually within 2–5 business days.</p>
    <p>Thanks for supporting the chronically lazy economy.</p>
    <a href="/" class="back-btn">Back to shop</a>
  </div>
  <script>try { localStorage.removeItem('vox_cart'); } catch(e) {}</script>
</body>
</html>
