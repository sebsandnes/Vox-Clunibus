<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed — VOXCLUNIBUS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .success-page {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: var(--black);
      color: var(--white);
      text-align: center;
      padding: 40px 24px;
      flex-direction: column;
    }
    .success-icon { font-size: 80px; margin-bottom: 24px; }
    .success-page h1 {
      font-family: var(--font-display);
      font-size: clamp(48px, 10vw, 96px);
      letter-spacing: 2px;
      color: var(--accent);
      margin-bottom: 16px;
    }
    .success-page p {
      font-size: 16px;
      color: rgba(245,242,236,0.6);
      max-width: 420px;
      line-height: 1.7;
      margin-bottom: 12px;
    }
    .back-btn {
      margin-top: 32px;
      display: inline-block;
      padding: 14px 36px;
      background: var(--accent);
      color: var(--white);
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 500;
      transition: background 0.2s;
    }
    .back-btn:hover { background: #c72e23; }
  </style>
</head>
<body>
  <div class="success-page">
    <div class="success-icon">🎉</div>
    <h1>Order Confirmed!</h1>
    <p>Your shirt is heading to the printer. You'll get a tracking email once it ships (usually within 2–3 business days).</p>
    <p>Thanks for supporting the chronically online economy.</p>
    <a href="/" class="back-btn">Back to shop</a>
  </div>
  <script>
    // Clear cart after successful order
    try { localStorage.removeItem('vox_cart'); } catch(e) {}
  </script>
</body>
</html>
